<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Ottimo - Hayatabad Peshawar | Complete Menu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --light-gray: #888;
            --white: #ffffff;
            --accent: #c9a962;
            --whatsapp: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .logo-text {
            font-family: 'Playfair Display', serif;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--medium-gray);
            z-index: 1000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            border: 2px solid var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--white);
        }

        .logo-text span {
            color: var(--accent);
            font-size: 0.9rem;
            display: block;
            letter-spacing: 3px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--light-gray);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .cart-btn {
            position: relative;
            background: transparent;
            border: 1px solid var(--medium-gray);
            color: var(--white);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-btn:hover {
            border-color: var(--accent);
            background: rgba(201, 169, 98, 0.1);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: var(--black);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .hero {
            margin-top: 80px;
            height: 90vh;
            background: linear-gradient(135deg, rgba(10,10,10,0.9) 0%, rgba(26,26,26,0.8) 100%),
                        url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1920') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 0 2rem;
        }

        .since-badge {
            display: inline-block;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1.5rem;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .hero h1 span {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            margin-top: 1rem;
        }

        .hero-location {
            font-size: 1.1rem;
            color: var(--light-gray);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--white);
            color: var(--black);
            padding: 1rem 2.5rem;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--white);
            padding: 1rem 2.5rem;
            border: 1px solid var(--white);
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: var(--white);
            color: var(--black);
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        .section-header {
            text-align: center;
            padding: 5rem 2rem 3rem;
            background: var(--dark-gray);
        }

        .section-label {
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            display: block;
        }

        .section-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: var(--light-gray);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .timing-banner {
            background: linear-gradient(90deg, var(--accent) 0%, #d4b978 100%);
            color: var(--black);
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .menu-filter {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem;
            background: var(--dark-gray);
            border-bottom: 1px solid var(--medium-gray);
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--medium-gray);
            color: var(--light-gray);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--white);
            color: var(--white);
            background: rgba(255,255,255,0.05);
        }

        .menu-section {
            padding: 4rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .menu-item {
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--accent);
            transition: height 0.3s;
            z-index: 2;
        }

        .menu-item:hover {
            border-color: var(--light-gray);
            transform: translateY(-5px);
        }

        .menu-item:hover::before {
            height: 100%;
        }

        .menu-item.hidden {
            display: none;
        }

        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--medium-gray) 0%, var(--dark-gray) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light-gray);
            font-size: 3rem;
        }

        .item-image i {
            opacity: 0.3;
        }

        .item-content {
            padding: 1.5rem;
        }

        .item-category-tag {
            color: var(--accent);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .item-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .item-description {
            color: var(--light-gray);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            min-height: 40px;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--medium-gray);
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--white);
        }

        .add-btn {
            width: 35px;
            height: 35px;
            border: 1px solid var(--medium-gray);
            background: transparent;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .add-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--black);
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .cart-overlay.active {
            display: block;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            height: 100vh;
            background: var(--black);
            border-left: 1px solid var(--medium-gray);
            z-index: 2001;
            transition: right 0.3s;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 2rem;
            border-bottom: 1px solid var(--medium-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-cart:hover {
            color: var(--accent);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            margin-bottom: 1rem;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .cart-item-price {
            color: var(--accent);
            font-size: 0.85rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .qty-btn {
            width: 25px;
            height: 25px;
            border: 1px solid var(--medium-gray);
            background: transparent;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .qty-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .remove-btn {
            color: #ff4757;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .cart-footer {
            padding: 2rem;
            border-top: 1px solid var(--medium-gray);
            background: var(--dark-gray);
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--light-gray);
        }

        .cart-row.total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
            border-top: 1px solid var(--medium-gray);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .tax-note {
            font-size: 0.75rem;
            color: var(--light-gray);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--whatsapp);
            color: white;
            border: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .checkout-btn:hover {
            background: #128C7E;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--light-gray);
        }

        .empty-cart i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--medium-gray);
        }

        .info-section {
            background: var(--dark-gray);
            padding: 4rem 5%;
            border-top: 1px solid var(--medium-gray);
        }

        .info-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
        }

        .info-card {
            text-align: center;
        }

        .info-icon {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .info-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .info-card p {
            color: var(--light-gray);
            font-size: 0.9rem;
        }

        .timing-highlight {
            color: var(--accent);
            font-weight: 600;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--whatsapp);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: all 0.3s;
            z-index: 999;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
        }

        footer {
            background: var(--black);
            border-top: 1px solid var(--medium-gray);
            padding: 3rem 5%;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .footer-logo span {
            color: var(--accent);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border: 1px solid var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light-gray);
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-links a:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        .copyright {
            color: var(--light-gray);
            font-size: 0.85rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--medium-gray);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .hero h1 {
                font-size: 3rem;
            }
            
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
            
            .section-title {
                font-size: 2rem;
            }
